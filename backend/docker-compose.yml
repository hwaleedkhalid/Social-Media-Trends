version: '3.8'

services:
  dashboard-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - USE_REAL_TWITTER_API=false
      - HDFS_HOST=http://hadoop:9870
      - HDFS_USER=hdfs
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./data:/app/data
    depends_on:
      - hadoop
    restart: unless-stopped

  hadoop:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop
    ports:
      - "9870:9870"  # HDFS Web UI
      - "9000:9000"  # HDFS Service
    environment:
      - CLUSTER_NAME=test
    volumes:
      - hadoop_data:/hadoop/dfs/name
    restart: unless-stopped

volumes:
  hadoop_data: